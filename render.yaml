# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# M5 public topology. Secret values are entered only in the Render dashboard.
services:
  - type: web
    runtime: python
    name: acon-api
    branch: dev
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: worker
    runtime: python
    name: acon-indexer
    branch: dev
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && if [ "$INDEXER_WORKER_ENABLED" = "true" ]; then python -m app.indexer.worker; else echo "indexer disabled"; exec sleep infinity; fi
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    envVars:
      - key: INDEXER_WORKER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: INDEXER_CHAIN_ID
        value: "11155111"
      - key: PREDICTION_MARKET_ADDRESS
        value: "0x03ae48f03C7822540a91DA2168602bd49dC510E9"
      - key: PREDICTION_MARKET_DEPLOYMENT_BLOCK
        value: "12051223"
      - key: PREDICTION_MARKET_ABI_PATH
        value: ../deployments/abi/PredictionMarket.721a6fef039a.4af9297937eb.abi.json
      - key: INDEXER_CONFIRMATION_DEPTH
        value: "2"
      - key: INDEXER_BLOCK_BATCH_SIZE
        value: "10"
      - key: INDEXER_POLL_INTERVAL_SECONDS
        value: "5"

  - type: worker
    runtime: python
    name: acon-registrar
    branch: dev
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && if [ "$REGISTRAR_WORKER_ENABLED" = "true" ]; then python -m app.registrar_process; else echo "registrar disabled"; exec sleep infinity; fi
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    envVars:
      - key: REGISTRAR_WORKER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false
      - key: INDEXER_CHAIN_ID
        value: "11155111"
      - key: PREDICTION_MARKET_ADDRESS
        value: "0x03ae48f03C7822540a91DA2168602bd49dC510E9"
      - key: SIGNER_CONFIRMATION_DEPTH
        value: "2"
      - key: SIGNER_POLL_INTERVAL_SECONDS
        value: "5"

  - type: worker
    runtime: python
    name: acon-proposer
    branch: dev
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && if [ "$PROPOSER_WORKER_ENABLED" = "true" ]; then python -m app.proposer_process; else echo "proposer disabled"; exec sleep infinity; fi
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PROPOSER_WORKER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: PROPOSER_PRIVATE_KEY
        sync: false
      - key: INDEXER_CHAIN_ID
        value: "11155111"
      - key: PREDICTION_MARKET_ADDRESS
        value: "0x03ae48f03C7822540a91DA2168602bd49dC510E9"
      - key: SIGNER_CONFIRMATION_DEPTH
        value: "2"
      - key: SIGNER_POLL_INTERVAL_SECONDS
        value: "5"
